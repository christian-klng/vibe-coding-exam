# Repositories with a known correct result. German and English cases on purpose: the model must
# judge and write equally well in both (see PLAN.md, section 7).

- name: readme-good-de
  task: readme
  locale: de
  expect: passed
  criteria: { location: true, what: true, features: true, setup: true, structure: true }
  repo:
    files:
      README.md: |
        # Lernplaner

        Lernplaner ist eine Web-App für Studierende, die ihre Prüfungsvorbereitung planen wollen.

        ## Funktionen
        - Lernpläne pro Fach anlegen
        - Erinnerungen per E-Mail
        - Fortschritt als Diagramm

        ## Lokal starten
        ```bash
        npm install
        npm run dev
        ```
      package.json: '{ "name": "lernplaner", "scripts": { "dev": "next dev" } }'

- name: readme-good-en
  task: readme
  locale: en
  expect: passed
  criteria: { location: true, what: true, features: true, setup: true }
  repo:
    files:
      README.md: |
        # Plant Pal

        Plant Pal is a mobile web app that reminds busy people to water their plants.

        ## Features
        - Add plants with a photo
        - Watering reminders
        - Care tips per species

        ## Getting started
        Run `npm install`, then `npm run dev`, and open http://localhost:3000.

