- name: commits-good-de
  task: commit-messages
  locale: de
  expect: passed
  criteria: { count: true, descriptive: true }
  repo:
    commits:
      - { message: "Login-Formular hinzufügen", additions: 80 }
      - { message: "Passwort-Prüfung korrigieren", additions: 12 }
      - { message: "README um Startanleitung ergänzen", additions: 20 }
      - { message: "Datenmodell für Lernpläne anlegen", additions: 45 }
      - { message: "Startseite mit Lernplan-Liste bauen", additions: 60 }
      - { message: "Projekt mit Next.js aufsetzen", additions: 200 }

