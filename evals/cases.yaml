- name: gitignore-good-en
  task: gitignore
  locale: en
  expect: passed
  repo:
    files:
      .gitignore: |
        node_modules
        .next
        dist
        .env*
        !.env.example
        .claude/settings.local.json
        CLAUDE.local.md
        .DS_Store
      CLAUDE.md: "# Project rules"
      .claude/settings.json: "{}"

- name: gitignore-env-missing-de
  task: gitignore
  locale: de
  expect: failed
  repo:
    files:
      .gitignore: |
        node_modules
        .next

- name: pull-request-good-de
  task: branch-pull-request
  locale: de
  expect: passed
  repo:
    branches: [main, feature/kontaktformular]
    pullRequests:
      - number: 3
        title: Kontaktformular hinzufügen
        body: Fügt ein Kontaktformular hinzu, damit Nutzer uns Fragen stellen können.
        merged: true
        headBranch: feature/kontaktformular
        baseBranch: main

- name: pull-request-no-description-en
  task: branch-pull-request
  locale: en
  expect: failed
  repo:
    pullRequests:
      - number: 1
        title: patch-1
        body: ""
        merged: true
        headBranch: patch-1
        baseBranch: main
