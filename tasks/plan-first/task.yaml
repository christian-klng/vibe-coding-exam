id: plan-first
version: 1
module: build
order: 2
title: { de: Erst planen lassen, dann bauen, en: Plan first, then build }
summary:
  de: Lass die KI ein Feature planen, prüfe den Plan und setze ihn erst dann um.
  en: Let the AI plan a feature, review the plan, and only then build it.
requiresRepo: true
appTypes: [all]
prerequisites: [claude-md]
check:
  type: ai
  scope: { paths: ["docs/plans/*.md", "docs/*.md"] }
  preChecks:
    - fileExists: "docs/plans/*.md"
  criteria:
    - id: plan-file
      required: true
      text:
        de: Im Ordner docs/plans liegt mindestens ein Plan als Markdown-Datei.
        en: The docs/plans folder contains at least one plan as a Markdown file.
    - id: plan-content
      required: true
      text:
        de: Der Plan beschreibt Ziel, betroffene Dateien bzw. Bereiche und die einzelnen Schritte.
        en: The plan describes the goal, affected files or areas, and the individual steps.
    - id: implemented
      required: true
      text:
        de: Es gibt Commits, die den Plan erkennbar umsetzen.
        en: There are commits that recognizably implement the plan.
    - id: review
      required: false
      text:
        de: Im Plan ist festgehalten, was du nach dem Review geändert oder ergänzt hast.
        en: The plan notes what you changed or added after reviewing it.
