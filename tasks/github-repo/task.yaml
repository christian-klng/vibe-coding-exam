id: github-repo
version: 1
module: start
order: 1
title: { de: Dein erstes GitHub-Repository, en: Your first GitHub repository }
summary:
  de: "Lege ein öffentliches GitHub-Repository mit mindestens einem Commit an und trage seine Adresse hier ein."
  en: "Create a public GitHub repository with at least one commit and enter its address here."
requiresRepo: false
showRepoForm: true
appTypes: [all]
check:
  type: auto
  preChecks:
    - repoIsPublic: true
    - minCommits: 1
  criteria:
    - id: public
      required: true
      text:
        de: Das Repository ist öffentlich erreichbar.
        en: The repository is publicly accessible.
    - id: first-commit
      required: true
      text:
        de: Das Repository enthält mindestens einen Commit.
        en: The repository contains at least one commit.
